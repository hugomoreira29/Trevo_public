spring.application.name=trevo-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trevo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trevo}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:trevo}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:change-me-to-a-secure-32-byte-secret-key}
app.security.jwt.expiration=PT15M
app.security.auth.refresh-token-expiration=P30D
app.upload.image.max-file-size-bytes=5242880
# Replicate AI
replicate.api-token=${REPLICATE_API_TOKEN:}
replicate.poll-interval-ms=${REPLICATE_POLL_INTERVAL_MS:2000}
replicate.timeout-ms=${REPLICATE_TIMEOUT_MS:240000}

app.profanity-filter.blocked-words=idiot,stupid,fuck,shit,bitch,asshole,bastard,cunt,burro,burra,burros,burras,cabrao,cabrão,cabroes,cabrões,caralho,cona,cu,estupido,estúpido,estupida,estúpida,foda,fodase,fodasse,foder,fodido,fodida,idiota,idiotas,merda,otario,otário,otaria,otária,porra,puta,putas

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Flyway properties:
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
