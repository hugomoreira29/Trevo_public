spring.datasource.url=jdbc:h2:mem:trevo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
app.security.jwt.secret=test-secret-key-with-at-least-thirty-two-bytes
app.security.jwt.expiration=PT15M
app.security.auth.refresh-token-expiration=P30D
CLOUDINARY_URL=cloudinary://test-key:test-secret@test-cloud
app.security.auth.password-reset-token-expiration=PT15M
spring.flyway.locations=classpath:db/migration